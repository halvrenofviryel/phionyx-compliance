[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "phionyx-compliance"
version = "0.1.1"
description = "Phionyx compliance evidence report draft generator — Article-13-oriented and other governance-framework mappings from RGE v0.2 audit chains."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [{ name = "Ali Toygar Abak", email = "phionyx@halvrenofviryel.com" }]
keywords = ["phionyx", "compliance", "evidence", "AI governance", "audit", "EU AI Act", "NIST AI RMF", "ISO 42001"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Legal Industry",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "phionyx-core>=0.8.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# `chain` = everything needed to read and verify a real envelope chain.
#
# The >=0.2.1 floor is a CORRECTNESS floor, not a convenience pin.
# phionyx-mcp-server 0.1.0's verify_chain() walks the HASH CHAIN ONLY and
# returns {valid, checked, broken_at, reason} with no per-dimension
# fields; its valid=True says nothing about signatures. Reading it as a
# signature fact reports SIGNATURE assurance for a chain whose signatures
# were never looked at. See phionyx_compliance.chain_view module header
# and REQUIRED_MCP_SERVER_VERSION, which must stay in sync with this pin.
chain = ["phionyx-mcp-server>=0.2.1"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "phionyx-mcp-server>=0.2.1"]

[project.urls]
Homepage = "https://phionyx.ai"
Repository = "https://github.com/halvrenofviryel/phionyx-compliance"
Documentation = "https://github.com/halvrenofviryel/phionyx-compliance#readme"
Issues = "https://github.com/halvrenofviryel/phionyx-compliance/issues"

[project.scripts]
phionyx-compliance = "phionyx_compliance.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/phionyx_compliance"]
